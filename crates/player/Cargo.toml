[package]
name = "oneshot-player"
description = "Native playback session: libmpv engine, presentation under the WebView, reconciliation, progress reporting"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[features]
# Generates TypeScript bindings for IPC types: `cargo test --features ts export_bindings`
ts = ["dep:ts-rs", "oneshot-core/ts", "oneshot-playback/ts"]

[dependencies]
ts-rs = { workspace = true, optional = true }
oneshot-core.workspace = true
oneshot-mpv.workspace = true
oneshot-playback.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
oneshot-capabilities.workspace = true
oneshot-jellyfin.workspace = true
oneshot-plex.workspace = true
oneshot-net.workspace = true
url.workspace = true

[lints]
workspace = true
