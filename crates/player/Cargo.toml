[package]
name = "oneshot-player"
description = "Native playback session: libmpv engine, presentation under the WebView, reconciliation, progress reporting"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[features]
# Generates TypeScript bindings for IPC types: `cargo test --features ts export_bindings`
ts = ["dep:ts-rs", "oneshot-core/ts", "oneshot-playback/ts"]

[dependencies]
ts-rs = { workspace = true, optional = true }
oneshot-core.workspace = true
oneshot-mpv.workspace = true
oneshot-playback.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

# Versions match the ones Tauri's macOS backend already locks; default
# features are off so only the bindings the presenter uses get compiled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSScreen",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "CALayer",
  "CAOpenGLLayer",
  "CATransaction",
  "CATransform3D",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

[dev-dependencies]
oneshot-capabilities.workspace = true
oneshot-jellyfin.workspace = true
oneshot-plex.workspace = true
oneshot-net.workspace = true
url.workspace = true

[lints]
workspace = true
