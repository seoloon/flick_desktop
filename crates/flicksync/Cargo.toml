[package]
name = "oneshot-flicksync"
description = "FlickSync client: watch-together rooms, protocol, deterministic playback synchronization engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[features]
# Generates TypeScript bindings for IPC types: `cargo test --features ts export_bindings`
ts = ["dep:ts-rs"]

[dependencies]
ts-rs = { workspace = true, optional = true }
async-trait.workspace = true
base64 = "0.22"
futures.workspace = true
hmac = "0.12"
oneshot-net.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }

[lints]
workspace = true


