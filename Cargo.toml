[workspace]
resolver = "3"
members = ["crates/core", "crates/mpv", "crates/capabilities", "crates/playback", "crates/net", "crates/providers/jellyfin", "crates/providers/plex", "crates/providers/tmdb", "crates/storage", "crates/flicksync", "crates/flickdd", "crates/flickserver","crates/player", "crates/catalog", "crates/cast", "app"]


[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
version = "0.5.0"

[workspace.dependencies]
oneshot-core = { path = "crates/core" }
oneshot-mpv = { path = "crates/mpv" }
oneshot-capabilities = { path = "crates/capabilities" }
oneshot-playback = { path = "crates/playback" }
oneshot-player = { path = "crates/player" }
oneshot-storage = { path = "crates/storage" }
oneshot-net = { path = "crates/net" }
oneshot-flicksync = { path = "crates/flicksync" }
oneshot-flickdd = { path = "crates/flickdd" }
oneshot-flickserver = { path = "crates/flickserver" }
oneshot-catalog = { path = "crates/catalog" }
oneshot-cast = { path = "crates/cast" }
oneshot-jellyfin = { path = "crates/providers/jellyfin" }
oneshot-plex = { path = "crates/providers/plex" }
oneshot-tmdb = { path = "crates/providers/tmdb" }

async-trait = "0.1"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# `http2`: negotiated over TLS (ALPN) where the server offers it (plex.tv,
# TMDB, HTTPS reverse proxies): many artwork requests share one connection.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "http2"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
wiremock = "0.6"
ts-rs = { version = "12", features = ["chrono-impl", "url-impl", "uuid-impl", "serde-json-impl"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
