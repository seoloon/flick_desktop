[package]
name = "Flick"
description = "Flick desktop shell (Tauri): IPC commands, image protocol, window and presenter wiring"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oneshot-core.workspace = true
oneshot-mpv.workspace = true
oneshot-capabilities.workspace = true
oneshot-playback.workspace = true
oneshot-player.workspace = true
oneshot-storage.workspace = true
oneshot-catalog.workspace = true
oneshot-cast.workspace = true
oneshot-flicksync.workspace = true
oneshot-flickdd.workspace = true
async-trait.workspace = true
oneshot-net.workspace = true
oneshot-jellyfin.workspace = true
oneshot-plex.workspace = true
oneshot-tmdb.workspace = true
futures.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
chrono.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
